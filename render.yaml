services:
  - type: web
    name: pos-ventas-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build:server
    startCommand: pnpm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
